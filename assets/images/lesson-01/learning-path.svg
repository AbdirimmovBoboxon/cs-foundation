<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Darsning o'rganish yo'li</title><desc id="desc">Maqsad, tushuntirish, amaliy mashq, test va natija ketma-ketligi.</desc>
